<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Currents — portada 3D</title>
		<link rel="preload" href="/fonts/ArchivoExpanded-Bold.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<canvas id="scene" role="img" aria-label="Portada 3D de Currents: rayas lila alrededor de una bola cromada y una estela multicolor. Por detrás, la contraportada con el tracklist."></canvas>
		<header class="hud">
			<span class="brand">Tame Impala</span>
			<span class="brand">Currents</span>
		</header>

		<section id="tracklist" class="player" aria-labelledby="tracklist-title" hidden>
			<div class="stripes" aria-hidden="true"></div>
			<div class="player-body">
				<header class="player-head">
					<h2 id="tracklist-title">Currents · 2015</h2>
					<span id="album-total"></span>
					<button id="player-min" class="head-button" type="button" aria-expanded="true" aria-controls="tracklist" aria-label="Minimizar el reproductor">
						<svg class="icon-min" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8 H13" /></svg>
						<svg class="icon-max" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 H13 V13 H3 Z" /></svg>
					</button>
					<button id="player-close" class="head-button" type="button" aria-label="Cerrar el reproductor" aria-keyshortcuts="Escape">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4 L12 12 M12 4 L4 12" /></svg>
					</button>
				</header>

				<div class="now">
					<button id="play" class="chrome" type="button" aria-label="Reproducir" aria-keyshortcuts="P">
						<svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2 L14 8 L4 14 Z" /></svg>
						<svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" /><rect x="9.5" y="2" width="3.5" height="12" /></svg>
					</button>
					<div class="now-text">
						<p id="now-label">Pulsa la bola o un tema</p>
						<p id="now-title">Currents</p>
					</div>
					<button id="prev" class="step" type="button" aria-label="Tema anterior" aria-keyshortcuts="B">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 2 L5 8 L13 14 Z M3 2 V14" /></svg>
					</button>
					<button id="next" class="step" type="button" aria-label="Tema siguiente" aria-keyshortcuts="N">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2 L11 8 L3 14 Z M13 2 V14" /></svg>
					</button>
				</div>

				<canvas id="viz" width="324" height="64" role="img" aria-label="Visualizador: rayas lila que ondulan con la música"></canvas>

				<div class="seek">
					<label for="seek" class="visually-hidden">Posición del tema</label>
					<input id="seek" class="rail" type="range" min="0" max="0" step="0.1" value="0" />
					<div class="times"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>
				</div>

				<div class="volume">
					<button id="mute" class="step" type="button" aria-label="Silenciar" aria-pressed="false" aria-keyshortcuts="M">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6 H5 L9 3 V13 L5 10 H2 Z" /><path class="waves" d="M11.5 5.5 Q13.5 8 11.5 10.5 M13 3.5 Q16.5 8 13 12.5" /></svg>
					</button>
					<label for="volume" class="visually-hidden">Volumen</label>
					<input id="volume" class="rail" type="range" min="0" max="1" step="0.01" value="1" />
				</div>

				<ol id="tracks" class="tracks"></ol>
				<p id="audio-source" class="note" role="status"></p>
			</div>
		</section>

		<footer class="caption">
			<span class="title">Tame Impala — Currents</span>
			<span class="hint">Arrastra para girar (también por detrás) · rueda para acercar · toca la bola para reproducir · R centra · T reproductor</span>
			<span id="model-status" role="status">Cargando portada…</span>
		</footer>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
