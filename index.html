<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Currents — portada 3D</title>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<canvas id="scene" role="img" aria-label="Portada 3D de Currents: rayas lila alrededor de una bola cromada y una estela multicolor."></canvas>
		<nav class="controls" aria-label="Controles de la portada">
			<button id="reset" type="button" aria-keyshortcuts="R" title="Volver a la vista inicial (tecla R)">Centrar <kbd aria-hidden="true">R</kbd></button>
			<button id="sound" type="button" aria-pressed="false" aria-keyshortcuts="S" title="Activar sonido (tecla S)">Sonido <kbd aria-hidden="true">S</kbd></button>
		</nav>
		<footer class="caption">
			<span class="title">Tame Impala — <em>Currents</em></span>
			<span class="hint">Arrastra para girar · rueda o pellizca para acercar · clic derecho para desplazar</span>
			<span id="model-status" role="status">Cargando portada…</span>
			<span id="sound-status" role="status"></span>
		</footer>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
